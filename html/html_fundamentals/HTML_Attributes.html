<!-- Attributes provide additional information about an HTML element.

Attributes are written inside the opening tag.

Syntax
    <tag attribute="value">Content</tag> 
example -->
    <p class="demo">hey there</p>       

<!-- Common Attributes

    Attribute	Purpose

    id	        Gives a unique identity to an element
    class	    Groups elements for CSS/JavaScript
    href	    Specifies a link destination
    src	        Specifies the source of an image/file
    alt	        Alternative text for an image
    title	    Provides additional information
    style	    Adds inline CSS    

Example     -->
    <a href="www.google.com">Google</a>
    <img src="cat.jpg" alt="A cat">
    <p id="para1" class="para">paragraph</p>
