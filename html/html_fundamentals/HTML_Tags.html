<!--HTML uses tags to define elements.

Example:
-->
<p>Hello World</p>
<!-- 
Here:

    <p> → Opening tag
    Hello World → Content
    </p> → Closing tag
    Complete structure → HTML element

Common HTML Tags -->
<h1>Heading</h1>
<p>Paragraph</p>
<a href="https://example.com">Link</a>
<img src="image.jpg" alt="Image">
<button>Click Me</button>

<!-- Some elements do not need a closing tag.

Example: -->

<br>
<hr>
<img src="photo.jpg" alt="Photo">

<!-- These are commonly called void elements. -->
