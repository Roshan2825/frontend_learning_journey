<!--1. HTML5 Introduction

HTML stands for HyperText Markup Language.

It is the standard markup language used to create and structure web pages.

HTML is not a programming language. It is a markup language because it uses tags
to describe the structure and meaning of content.


HTML5 is a modern version of HTML that provides features for:

Structuring web pages
Audio and video
Forms
Graphics
Semantic elements
Better support for modern web applications-->

<!Doctype html>
<html>
    <head>
        <title>My Web Page</title>
    </head>
    <body>
        <h1>Welcome</h1>
        <p>This is my first Web</p>
    </body>
</html>
