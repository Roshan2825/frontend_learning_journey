<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>

    <header>
        <h1>Job Application Form</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Job Requirements</h2>
            <ul>
                <li>Knowledge of HTML</li>
                <li>Basic CSS knowledge</li>
                <li>Problem-solving skills</li>
            </ul>
        </section>

        <section>
            <h2>Application Details</h2>

            <form action="/apply" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name"
                       name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email"
                       name="email" required>
                <br><br>

                <label for="role">Job Role:</label>
                <select id="role" name="role" required>
                    <option value="">Select a role</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="angular">Angular Developer</option>
                </select>
                <br><br>

                <p>Employment Type:</p>

                <label>
                    <input type="radio" name="employment"
                           value="full-time" required>
                    Full-time
                </label>

                <label>
                    <input type="radio" name="employment"
                           value="internship">
                    Internship
                </label>
                <br><br>

                <label for="cover">Cover Letter:</label>
                <textarea id="cover" name="cover"
                          rows="5"></textarea>
                <br><br>

                <button type="submit">Apply Now</button>
                <button type="reset">Clear</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Contact our recruitment team for more information.</p>
    </footer>

</body>
</html>
