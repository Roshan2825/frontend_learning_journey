<!--1. HTML Lists

HTML lists are used to display related items in an organized format.

There are three main types of lists:

Ordered list — <ol>

Unordered list — <ul>

Description list — <dl>

1.1 Unordered List — <ul>

An unordered list displays items with bullets. Use it when the order of items does not matter.

Real-world use cases: navigation menus, skills, features, shopping lists.

Example:

<h2>Technical Skills</h2>

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>Angular</li>
</ul>

Browser output

Technical Skills
HTML
CSS
JavaScript
Angular

Important tags:

<ul> — creates the unordered list.

<li> — defines each list item.

1.2 Ordered List — <ol>

An ordered list displays items in a sequence, usually numbered.

Real-world use cases: installation instructions, checkout steps, tutorials, workflows.

<h2>How to Create an Account</h2>

<ol>
    <li>Open the website.</li>
    <li>Click Register.</li>
    <li>Enter your details.</li>
    <li>Submit the form.</li>
</ol>

Browser output

How to Create an Account
Open the website.
Click Register.
Enter your details.
Submit the form.
Useful <ol> attributes

start — specifies the starting number.

<ol start="5">
    <li>Step five</li>
    <li>Step six</li>
</ol>

type — specifies the numbering style.

<ol type="A">
    <li>Frontend</li>
    <li>Backend</li>
</ol>

Common type values are 1, A, a, I, and i.

1.3 Description List — <dl>

A description list displays terms and their descriptions.

Real-world use cases: FAQs, glossaries, product specifications.

<h2>Web Development Terms</h2>

<dl>
    <dt>HTML</dt>
    <dd>Defines the structure of a webpage.</dd>

    <dt>CSS</dt>
    <dd>Controls the appearance of a webpage.</dd>

    <dt>JavaScript</dt>
    <dd>Adds interactivity to a webpage.</dd>
</dl>

<dl> — description list.

<dt> — term or name.

<dd> — description of the term.

1.4 Nested Lists

A nested list is a list inside another list.

Example: displaying categories and their skills.

<h2>Technical Skills</h2>

<ul>
    <li>Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </li>

    <li>Backend
        <ul>
            <li>Java</li>
            <li>Spring Boot</li>
        </ul>
    </li>
</ul>

Practical tip: Use nested lists when items genuinely belong to a parent category
. Don't use lists merely to create spacing or page layouts.-->
